[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ixbrl-parse"
version = "0.10.1"
authors = [
    {name = "Cybermaggedon", email = "mark@cyberapocalypse.co.uk"}
]
description = "Parse iXBRL files, can present in RDF"
readme = "README.md"
requires-python = ">=3.6"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "number_parser",
    "requests",
    "lxml",
    "rdflib",
]

[project.urls]
Homepage = "https://github.com/cybermaggedon/ixbrl-parse"
Download = "https://github.com/cybermaggedon/ixbrl-parse/archive/refs/tags/v0.9.4.tar.gz"

[tool.setuptools]
script-files = [
    "scripts/ixbrl-dump",
    "scripts/ixbrl-report",
    "scripts/ixbrl-markdown",
    "scripts/ixbrl-to-rdf",
    "scripts/ixbrl-to-csv",
    "scripts/ixbrl-to-json",
    "scripts/ixbrl-to-xbrl",
    "scripts/ixbrl-to-kv",
    "scripts/ixbrl-diff",
]

[tool.setuptools.packages.find]
include = ["ixbrl_parse*"]
